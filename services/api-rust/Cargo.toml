[package]
name = "matchpoint_api"
version = "0.1.0"
edition = "2021"
default-run = "matchpoint_api"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
axum = "0.7"
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
aes-gcm = "0.10"
base64 = "0.22"
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
