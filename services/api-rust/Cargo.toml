[package]
name = "matchpoint_api"
version = "0.1.0"
edition = "2021"
default-run = "matchpoint_api"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.7", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
diesel = { version = "2.2", features = ["postgres", "uuid", "chrono"] }
diesel-async = { version = "0.5", features = ["postgres", "bb8"] }
# Migraciones compiladas dentro del binario: al desplegar no hay
# terminal donde correr `diesel migration run`, y olvidarlas deja la
# app en pie contra un esquema viejo. Necesita conexion sincrona, que
# es lo unico que soporta `MigrationHarness`.
diesel_migrations = "2.2"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
futures-util = "0.3"
uuid = { version = "1.23.5", features = ["v4", "serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
diesel-derive-enum = { version = "2.1", features = ["postgres"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.11"
utoipa = { version = "4", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }
# Solo lo usa `bin/datagen`, para generar las fotos de los perfiles de
# prueba (ver el modulo `photo` alli). Se prefirio `png` a `image` por ser
# mucho mas ligero: solo hace falta escribir un PNG RGB, no decodificar ni
# transformar nada.
png = "0.17"
# Para abrir el socket en dual-stack a mano (IPv6 + IPv4 en el mismo
# listener). `TcpListener::bind("[::]:...")` no vale: en Windows el
# flag IPV6_V6ONLY viene activado por defecto y deja fuera IPv4.
# Ya estaba en el arbol de dependencias via tokio, no anade peso real.
socket2 = "0.5"
# Cliente HTTP para llamar a la API de Resend (envio de emails).
# rustls y no TLS del sistema: evita depender de OpenSSL, que en
# Windows y en la imagen slim de Docker es justo lo que da guerra.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
] }
