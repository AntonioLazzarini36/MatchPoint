services:
  db:
    image: postgres:16
    container_name: matchpoint_db
    environment:
      POSTGRES_USER: matchpoint
      POSTGRES_PASSWORD: matchpoint
      POSTGRES_DB: matchpoint
    ports:
      - "5432:5432"
    volumes:
      - matchpoint_db_data:/var/lib/postgresql/data

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: matchpoint_api
    env_file:
      - ./.env
    ports:
      - "3000:3000"
    depends_on:
      - db
    volumes:
      - ./services/api:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  matchpoint_db_data: